<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/icon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF9F6" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="PhotoBooth — Making Memories. Take instant photos online, choose from aesthetic photo strip templates and download them. Works on mobile and desktop." />
    <meta name="keywords" content="photo booth, photo strip, free, camera, photos, instant, online, mobile, desktop, templates" />
    <meta name="author" content="Photo Booth App" />
    <meta name="robots" content="index, follow" />

    <!-- Social Media Meta Tags (Open Graph) -->
    <meta property="og:title" content="PhotoBooth — Making Memories" />
    <meta property="og:description" content="Free online photo booth! Take instant photos and download beautiful photo strips. Works on any device." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:url" content="https://your-photo-booth.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PhotoBooth" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PhotoBooth — Making Memories" />
    <meta name="twitter:description" content="Take instant photos online and turn them into beautiful photo strips." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts: UI (DM Sans, Playfair Display, Great Vibes) + photo strip template display faces -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Great+Vibes&family=Lilita+One&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Press+Start+2P&family=Shrikhand&display=swap"
    />

    <!-- Camera permissions hint -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PhotoBooth" />

    <title>PhotoBooth — Making Memories</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PhotoBooth",
      "description": "Online photo booth for taking instant photos and creating photo strips",
      "url": "https://your-photo-booth.vercel.app",
      "applicationCategory": "Photography",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </body>
</html>
